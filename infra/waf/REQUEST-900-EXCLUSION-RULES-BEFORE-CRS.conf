# Lab-specific CRS exclusions, loaded before the CRS rules.
# Found in Phase 4: an open Juice Shop tab in Kali's browser was blocked ~160 times in a few minutes
# on /socket.io/ (920350 + 920420 reached the anomaly threshold), which fired rule 100103 and made Shuffle
# block Kali for normal browsing.

# 920350 "Host header is a numeric IP address": every client in this lab browses by IP (no DNS).
SecAction "id:1000,phase:1,pass,nolog,ctl:ruleRemoveById=920350"

# 920420 "Request content type is not allowed by policy": Juice Shop's socket.io long-polling POSTs
# text/plain. Removed for that path only, so the content-type check stays on for the rest of the app.
SecRule REQUEST_FILENAME "@beginsWith /socket.io/" \
    "id:1001,phase:1,pass,nolog,ctl:ruleRemoveById=920420"
