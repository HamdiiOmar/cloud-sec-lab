# Phase 5: MLflow + training job on the HOST.
#   docker compose up -d mlflow                  MLflow UI: http://localhost:5000
#   ./pipeline/run.sh                            collect -> train -> deploy (what the nightly cron runs)

services:
  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.18.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - ./mlflow-data:/mlflow
    environment:
      # MLflow 3 starts ~6 background job workers (~215 MB each) for GenAI features this lab doesn't use
      MLFLOW_SERVER_ENABLE_JOB_EXECUTION: "false"
    command: >
      mlflow server --host 0.0.0.0 --port 5000
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --artifacts-destination /mlflow/artifacts --serve-artifacts
      --allowed-hosts "mlflow,mlflow:5000,localhost,localhost:5000,127.0.0.1,127.0.0.1:5000"
      --workers 1
    mem_limit: 1g                      # was 2.5 GB idle with defaults; the host froze once on RAM

  trainer:
    build:
      context: .
      args: {TRAIN: "1"}
    image: lab-ml-train:local
    profiles: [train]                  # only runs on demand: docker compose run --rm trainer
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    depends_on: [mlflow]
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      DATA_DIR: /data
      OUT_DIR: /out
      NORMAL_SRC: 192.168.56.1
      HOME: /tmp
    volumes:
      - ./data:/data:ro
      - ./models:/out
    command: ["python", "-m", "pipeline.train"]
    mem_limit: 3g                      # a runaway training job gets killed, not the whole host
