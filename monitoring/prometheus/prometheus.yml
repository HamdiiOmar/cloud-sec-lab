global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: node
    static_configs:
      - targets: ["192.168.56.40:9100"]
        labels:
          vm: ubuntu-target

  - job_name: cadvisor
    static_configs:
      - targets: ["192.168.56.40:8081"]
        labels:
          vm: ubuntu-target

  - job_name: lab-ml               # Phase 5: ML scoring service
    static_configs:
      - targets: ["192.168.56.40:8000"]
        labels:
          vm: ubuntu-target
