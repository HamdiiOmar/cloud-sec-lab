# Phase 4: Shuffle SOAR on the HOST (192.168.56.1).
# Based on Shuffle v2.3.0's docker-compose.yml, changed for the lab:
#  - images pinned to 2.3.0 instead of :latest
#  - shuffle-security left out (optional, no versioned image)
#  - UI on localhost only; backend also on the lab IP so Wazuh can post alerts; OpenSearch not published
#  - OpenSearch heap 1 GB instead of 3 GB
#  - no Swarm mode (see orborus)
# Start: ./setup.sh   (generates .env with random secrets, then docker compose up -d)

services:
  frontend:
    image: ghcr.io/shuffle/shuffle-frontend:2.3.0
    container_name: shuffle-frontend
    hostname: shuffle-frontend
    ports:
      - "127.0.0.1:3001:80"
      - "127.0.0.1:3443:443"
    networks: [shuffle]
    environment:
      - BACKEND_HOSTNAME=${BACKEND_HOSTNAME}
    restart: unless-stopped
    depends_on: [backend]

  backend:
    image: ghcr.io/shuffle/shuffle-backend:2.3.0
    container_name: shuffle-backend
    hostname: ${BACKEND_HOSTNAME}
    ports:
      - "127.0.0.1:5001:5001"
      - "192.168.56.1:5001:5001"     # Wazuh manager posts alerts here (lab network only)
    networks: [shuffle]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${SHUFFLE_APP_HOTLOAD_LOCATION}:/shuffle-apps:z
      - ${SHUFFLE_FILE_LOCATION}:/shuffle-files:z
    env_file: .env
    environment:
      - SHUFFLE_APP_HOTLOAD_FOLDER=/shuffle-apps
      - SHUFFLE_FILE_LOCATION=/shuffle-files
    restart: unless-stopped
    depends_on: [opensearch]

  orborus:
    image: ghcr.io/shuffle/shuffle-orborus:2.3.0
    container_name: shuffle-orborus
    hostname: shuffle-orborus
    networks: [shuffle]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - SHUFFLE_APP_SDK_TIMEOUT=300
      - ENVIRONMENT_NAME=Shuffle
      - ORG_ID=Shuffle
      - BASE_URL=http://${OUTER_HOSTNAME}:5001
      - DOCKER_API_VERSION=1.44
      - SHUFFLE_PASS_WORKER_PROXY=${SHUFFLE_PASS_WORKER_PROXY}
      - SHUFFLE_PASS_APP_PROXY=${SHUFFLE_PASS_APP_PROXY}
      - SHUFFLE_STATS_DISABLED=true
      - SHUFFLE_LOGS_DISABLED=true
      # No SHUFFLE_SWARM_CONFIG=run (upstream default): it tries to turn the host's Docker into a Swarm
      # manager, which fails on a multi-NIC host. Without it Orborus starts one worker container per run.
      - CLEANUP=false
      - SHUFFLE_WORKER_IMAGE=ghcr.io/shuffle/shuffle-worker:2.3.0
    env_file: .env
    restart: unless-stopped
    security_opt:
      - seccomp:unconfined

  opensearch:
    image: opensearchproject/opensearch:3.2.0
    hostname: shuffle-opensearch
    container_name: shuffle-opensearch
    environment:
      - "OPENSEARCH_JAVA_OPTS=-Xms1g -Xmx1g"
      - bootstrap.memory_lock=true
      - DISABLE_PERFORMANCE_ANALYZER_AGENT_CLI=true
      - cluster.initial_master_nodes=shuffle-opensearch
      - cluster.routing.allocation.disk.threshold_enabled=false
      - cluster.name=shuffle-cluster
      - node.name=shuffle-opensearch
      - node.store.allow_mmap=false
      - discovery.seed_hosts=shuffle-opensearch
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=${SHUFFLE_OPENSEARCH_PASSWORD}
    ulimits:
      memlock: {soft: -1, hard: -1}
      nofile: {soft: 65536, hard: 65536}
    volumes:
      - shuffle-database:/usr/share/opensearch/data:z
    networks: [shuffle]
    restart: unless-stopped

volumes:
  shuffle-database:
    driver: local
    driver_opts:
      type: none
      device: ${DB_LOCATION}
      o: bind

networks:
  shuffle:
    driver: bridge
